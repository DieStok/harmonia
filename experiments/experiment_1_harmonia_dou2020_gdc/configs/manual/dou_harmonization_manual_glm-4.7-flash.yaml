# =============================================================================
# Manual Experiment - GLM-4.7-Flash via any-llm (Ollama)
# =============================================================================
# This is a MANUAL experiment config - no automated messages.
# Start Beaker with these LLM settings and interact via the web UI.
#
# Usage:
#   1. Copy llm settings to your .env file (see env_settings below)
#   2. cd to data directory: cd /hpc/compgen/projects/llm_GEO_project/harmonia_metadata_agent/raw/datasets_harmonia/one_metadata_table_gdc_schema/data
#   3. Run: /hpc/compgen/projects/llm_GEO_project/harmonia_metadata_agent/analysis/dstoker/harmonia/exec_apptainer_harmonia.sh
#   4. Connect via browser and interact manually
#   5. Data file dou.csv will be in the working directory
#
# Dataset: Dou 2020 - Proteogenomic Characterization of Endometrial Carcinoma
# Based on the Harmonia paper: https://arxiv.org/pdf/2502.07132
# =============================================================================

experiment:
  name: "dou_gdc_manual_anyllm-ollama_glm-4.7-flash"
  description: "Manual harmonization of dou.csv to GDC schema (GLM-4.7-Flash Q8_0 via any-llm/Ollama)"
  manual_mode: true
  dataset_metadata: "/hpc/compgen/projects/llm_GEO_project/harmonia_metadata_agent/raw/datasets_harmonia/one_metadata_table_gdc_schema/experiment_metadata.yaml"

llm:
  provider: ollama
  model: glm-4.7-flash:q8_0
  temperature: 0.0

# bdi-kit internal LLM configuration for schema/value matching.
# These default to the top-level llm.model if not specified.
# Set explicitly here so each config documents which LLM bdi-kit uses internally.
bdikit_models:
  instance_matching_llm: glm-4.7-flash:q8_0
  numeric_instance_matching_llm: glm-4.7-flash:q8_0
  # embedding_model_for_instance_matching: bert-base-multilingual-cased  # default, not an LLM
  schema_matching_llm: glm-4.7-flash:q8_0
  magneto_zero_shot_schema_matching_llm: glm-4.7-flash:q8_0
  magneto_fine_tuned_schema_matching_llm: glm-4.7-flash:q8_0
output:
  base_dir: "/hpc/compgen/projects/llm_GEO_project/harmonia_metadata_agent/analysis/dstoker/harmonia/results"

# Environment variables to set in .env before running exec_apptainer_harmonia.sh
env_settings:
  LLM_SERVICE_PROVIDER: "ollama"
  LLM_SERVICE_MODEL: "glm-4.7-flash:q8_0"
  LLM_TEMPERATURE: "0.0"
  # Note: Ollama runs locally, no API key needed

# Data locations
data:
  working_directory: "/hpc/compgen/projects/llm_GEO_project/harmonia_metadata_agent/raw/datasets_harmonia/one_metadata_table_gdc_schema/data"
  source_file: "dou.csv"
  source_file_absolute: "/hpc/compgen/projects/llm_GEO_project/harmonia_metadata_agent/raw/datasets_harmonia/one_metadata_table_gdc_schema/data/dou.csv"
  target_schema: "gdc"
  paper_reference: "https://doi.org/10.1016/j.cell.2020.01.026"

# No messages - this is for manual interaction
# messages: []
context_management:
  python_kernel:
    max_variable_size: 20000
    state_budget_pct: 25
  archytas:
    summarization_threshold_pct: 50
    max_react_steps: 30
