experiment:
  name: dou_gdc_manual_anyllm-ollama_devstral
  description: Manual harmonization of dou.csv to GDC schema (Devstral 123B via any-llm/Ollama)
  manual_mode: true
  dataset_metadata: /hpc/compgen/projects/llm_GEO_project/harmonia_metadata_agent/raw/datasets_harmonia/one_metadata_table_gdc_schema/experiment_metadata.yaml
llm:
  provider: ollama
  model: devstral:latest
  temperature: 0.0
bdikit_models:
  instance_matching_llm: devstral:latest
  numeric_instance_matching_llm: devstral:latest
  schema_matching_llm: devstral:latest
  magneto_zero_shot_schema_matching_llm: devstral:latest
  magneto_fine_tuned_schema_matching_llm: devstral:latest
output:
  base_dir: /hpc/compgen/projects/llm_GEO_project/harmonia_metadata_agent/analysis/dstoker/harmonia/results
env_settings:
  LLM_SERVICE_PROVIDER: ollama
  LLM_SERVICE_MODEL: devstral:latest
  LLM_TEMPERATURE: '0.0'
data:
  base_dir: /hpc/compgen/projects/llm_GEO_project/harmonia_metadata_agent/raw/datasets_harmonia
  files:
  - source: one_metadata_table_gdc_schema/data/dou.csv
    mount_as: dou.csv
context_management:
  python_kernel:
    max_variable_size: 20000
    state_budget_pct: 25
  archytas:
    summarization_threshold_pct: 50
    max_react_steps: 30
tracing:
  enabled: true
  phoenix_endpoint: http://hpcs05:6006
