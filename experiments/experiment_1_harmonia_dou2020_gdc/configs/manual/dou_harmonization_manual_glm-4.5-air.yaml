experiment:
  name: dou_gdc_manual_anyllm-openrouter_glm-4.5-air
  description: Manual harmonization of dou.csv to GDC schema (GLM-4.5-Air via any-llm/OpenRouter)
  manual_mode: true
  dataset_metadata: /hpc/compgen/projects/llm_GEO_project/harmonia_metadata_agent/raw/datasets_harmonia/one_metadata_table_gdc_schema/experiment_metadata.yaml
llm:
  provider: openrouter
  model: z-ai/glm-4.5-air:free
  temperature: 0.0
bdikit_models:
  instance_matching_llm: z-ai/glm-4.5-air:free
  numeric_instance_matching_llm: z-ai/glm-4.5-air:free
  schema_matching_llm: z-ai/glm-4.5-air:free
  magneto_zero_shot_schema_matching_llm: z-ai/glm-4.5-air:free
  magneto_fine_tuned_schema_matching_llm: z-ai/glm-4.5-air:free
output:
  base_dir: /hpc/compgen/projects/llm_GEO_project/harmonia_metadata_agent/analysis/dstoker/harmonia/results
env_settings:
  LLM_SERVICE_PROVIDER: openrouter
  LLM_SERVICE_MODEL: z-ai/glm-4.5-air:free
  LLM_TEMPERATURE: '0.0'
data:
  base_dir: /hpc/compgen/projects/llm_GEO_project/harmonia_metadata_agent/raw/datasets_harmonia
  files:
  - source: one_metadata_table_gdc_schema/data/dou.csv
    mount_as: dou.csv
context_management:
  archytas:
    summarization_threshold_pct: 50
    max_react_steps: 30
tracing:
  enabled: true
  phoenix_endpoint: http://hpcs05:6006
