experiment:
  name: dou_harmonization_manual_google-gemini-3-flash-preview
  description: Manual harmonization of dou.csv to GDC schema (google/gemini-3-flash-preview
    via any-llm/OpenRouter)
  manual_mode: true
  dataset_metadata: /hpc/compgen/projects/llm_GEO_project/harmonia_metadata_agent/raw/datasets_harmonia/one_metadata_table_gdc_schema/experiment_metadata.yaml
llm:
  provider: openrouter
  model: google/gemini-3-flash-preview
  temperature: 0.0
bdikit_models:
  instance_matching_llm: google/gemini-3-flash-preview
  numeric_instance_matching_llm: google/gemini-3-flash-preview
  schema_matching_llm: google/gemini-3-flash-preview
  magneto_zero_shot_schema_matching_llm: google/gemini-3-flash-preview
  magneto_fine_tuned_schema_matching_llm: google/gemini-3-flash-preview
output:
  base_dir: /hpc/compgen/projects/llm_GEO_project/harmonia_metadata_agent/analysis/dstoker/harmonia/results
env_settings:
  LLM_SERVICE_PROVIDER: openrouter
  LLM_SERVICE_MODEL: google/gemini-3-flash-preview
  LLM_TEMPERATURE: '0.0'
data:
  base_dir: /hpc/compgen/projects/llm_GEO_project/harmonia_metadata_agent/raw/datasets_harmonia
  files:
  - source: one_metadata_table_gdc_schema/data/dou.csv
    mount_as: dou.csv
context_management:
  archytas:
    summarization_threshold_pct: 50
    context_window_override: 1048576
    max_react_steps: 30
tracing:
  enabled: true
  phoenix_endpoint: http://hpcs05:6006
