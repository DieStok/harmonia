# =============================================================================
# Manual Experiment - MIMO-v2-Flash via any-llm (OpenRouter)
# =============================================================================
# This is a MANUAL experiment config - no automated messages.
# Start Beaker with these LLM settings and interact via the web UI.
#
# Usage:
#   1. Copy llm settings to your .env file (see env_settings below)
#   2. Ensure OPENROUTER_API_KEY is set in .env
#   3. cd to data directory: cd /hpc/compgen/projects/llm_GEO_project/harmonia_metadata_agent/raw/datasets_harmonia/one_metadata_table_gdc_schema/data
#   4. Run: /hpc/compgen/projects/llm_GEO_project/harmonia_metadata_agent/analysis/dstoker/harmonia/exec_apptainer_harmonia.sh
#   5. Connect via browser and interact manually
#   6. Data file dou.csv will be in the working directory
#
# Dataset: Dou 2020 - Proteogenomic Characterization of Endometrial Carcinoma
# Based on the Harmonia paper: https://arxiv.org/pdf/2502.07132
# =============================================================================

experiment:
  name: "dou_gdc_manual_anyllm-openrouter_mimo-v2-flash"
  description: "Manual harmonization of dou.csv to GDC schema (MIMO-v2-Flash via any-llm/OpenRouter)"
  manual_mode: true
  dataset_metadata: "/hpc/compgen/projects/llm_GEO_project/harmonia_metadata_agent/raw/datasets_harmonia/one_metadata_table_gdc_schema/experiment_metadata.yaml"

llm:
  provider: anyllm:openrouter
  model: xiaomi/mimo-v2-flash:free
  temperature: 0.0

output:
  base_dir: "/hpc/compgen/projects/llm_GEO_project/harmonia_metadata_agent/analysis/dstoker/harmonia/results"

# Environment variables to set in .env before running exec_apptainer_harmonia.sh
env_settings:
  LLM_SERVICE_PROVIDER: "anyllm:openrouter"
  LLM_SERVICE_MODEL: "xiaomi/mimo-v2-flash:free"
  LLM_TEMPERATURE: "0.0"
  # Required: OPENROUTER_API_KEY=your_key_here

# Data locations
data:
  working_directory: "/hpc/compgen/projects/llm_GEO_project/harmonia_metadata_agent/raw/datasets_harmonia/one_metadata_table_gdc_schema/data"
  source_file: "dou.csv"
  source_file_absolute: "/hpc/compgen/projects/llm_GEO_project/harmonia_metadata_agent/raw/datasets_harmonia/one_metadata_table_gdc_schema/data/dou.csv"
  target_schema: "gdc"
  paper_reference: "https://doi.org/10.1016/j.cell.2020.01.026"

# No messages - this is for manual interaction
# messages: []
