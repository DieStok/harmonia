# =============================================================================
# Dou Dataset Basic Conversation Script
# =============================================================================
# A reusable conversation script for harmonizing dou.csv.
# Can be imported into experiment configs.
# =============================================================================

name: "dou_basic"
description: "Basic harmonization conversation for dou.csv"

messages:
  - content: |
      Load the file dou.csv as a dataframe.
      Then subset the columns to just these 4: 'sample_type', 'gender', 'sample_site', 'diagnosis'
    wait_seconds: 60

  - content: |
      Please match this dataframe to the GDC schema using the embeddings method.
      Show me the top 3 matching columns for each source column.
    wait_seconds: 120

  - content: |
      Now please also match the values for each column.
      For any values that don't have a direct match, suggest the closest alternative.
    wait_seconds: 180

  - content: |
      Materialize the mapping and show me the harmonized dataframe.
    wait_seconds: 60
