---
version: '3.8'

services:
  jupyter:
    build:
      dockerfile: Dockerfile
      context: .
    ports:
      - "${PORT:-8100}:${PORT:-8100}"
    env_file:
      - .env
    environment:
      # Override JUPYTER_SERVER for Docker networking
      - JUPYTER_SERVER=http://jupyter:${PORT:-8100}
      - PORT=${PORT:-8100}
    working_dir: /jupyter
    volumes:
      - .:/jupyter
    command: ["sh", "-c", "beaker dev watch --ip 0.0.0.0 --port $PORT"]
